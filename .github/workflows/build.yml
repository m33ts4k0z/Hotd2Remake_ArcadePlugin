# Builds the plugin and the settings tool (Debug and Release) once a day, only if main has commits
# that were not built successfully yet. "Run workflow" in the Actions tab always builds.
# The Release files are kept as an artifact laid out like the game folder, and published as a GitHub release
# with the commits since the previous release as notes (the first one is the "Initial release")
name: Build

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux job : the Windows build is skipped when there is nothing new
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "Last successful run: ${last:-none}, now: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Whole history and tags, for the release notes
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the game DLLs are stripped reference copies
        shell: pwsh
        run: |
          $real = Get-ChildItem Hotd2Remake_ArcadePlugin/UnityLibs -Filter *.dll |
            Where-Object { $_.Name -notin '0Harmony.dll', 'BepInEx.dll' } |
            Where-Object { -not [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName)).Contains('ReferenceAssemblyAttribute') }
          foreach ($dll in $real) {
            Write-Output "::error file=Hotd2Remake_ArcadePlugin/UnityLibs/$($dll.Name)::$($dll.Name) is not a stripped reference assembly, the game's real DLLs must not be committed (see UnityLibs/About_these_dlls.txt)"
          }
          if ($real) { exit 1 }

      # Same reference assemblies as a local build, whatever targeting packs the runner has
      - name: Get the .NET Framework 4.8 reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net48/1.0.3 -OutFile "$env:RUNNER_TEMP/net48.zip"
          Expand-Archive "$env:RUNNER_TEMP/net48.zip" "$env:RUNNER_TEMP/net48"
          "NET48_ROOT=$env:RUNNER_TEMP\net48\build" >> $env:GITHUB_ENV

      - name: Build Debug and Release
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          foreach ($config in 'Debug', 'Release') {
            & $msbuild Hotd2Remake_ArcadePlugin.sln /p:Configuration=$config "/p:TargetFrameworkRootPath=$env:NET48_ROOT" /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # BepInEx included like argonlefou's plugin : the zip is unzipped as it is in the game folder.
      # Same version as DemulShooter's Unity packages
      - name: Package the Release files
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BepInEx/BepInEx/releases/download/v5.4.21/BepInEx_x64_5.4.21.0.zip -OutFile "$env:RUNNER_TEMP/bepinex.zip"
          Expand-Archive "$env:RUNNER_TEMP/bepinex.zip" package
          $version = (Get-Item package/BepInEx/core/BepInEx.dll).VersionInfo.FileVersion
          if ($version -ne '5.4.21.0') { Write-Output "::error::Unexpected BepInEx version $version"; exit 1 }
          New-Item -ItemType Directory package/BepInEx/plugins -Force | Out-Null
          Copy-Item Hotd2Remake_ArcadePlugin/bin/Release/Hotd2Remake_ArcadePlugin.dll, Hotd2Remake_ArcadePlugin/Hotd2Remake_ArcadePlugin.ini package/BepInEx/plugins
          Copy-Item Hotd2Remake_ArcadeConfig/bin/Release/Hotd2Remake_ArcadeConfig.exe, README.md package

      - uses: actions/upload-artifact@v4
        with:
          name: Hotd2Remake_ArcadePlugin
          path: package/
          if-no-files-found: error

      # Tag from the date (v2026.10.22, then .2, .3... on the same day), notes from the commits since the previous release
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          if (git tag --points-at HEAD --list 'v*') {
            Write-Output "This commit is already released"
            exit 0
          }
          $prev = git tag --merged HEAD --list 'v*' --sort=-committerdate | Select-Object -First 1
          $date = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          $tag = "v$date"
          $n = 1
          while (git tag --list $tag) { $n++; $tag = "v$date.$n" }
          $title = if ($prev) { $tag } else { 'Initial release' }
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $repoUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"

          $notes = @(
            'Unzip in the game folder, next to `THE HOUSE OF THE DEAD 2 Remake.exe`. [BepInEx 5.4.21](https://github.com/BepInEx/BepInEx/releases/tag/v5.4.21) is included, see the README.',
            '')
          foreach ($sha in git log --format=%H $range) {
            $subject = git log -1 --format=%s $sha
            $body = git log -1 --format=%b $sha | Where-Object { $_ -notmatch '^(Co-Authored-By|Signed-off-by):' }
            $notes += "### $subject ([``$($sha.Substring(0, 7))``]($repoUrl/commit/$sha))", ''
            if ($body) { $notes += ($body -join "`n").Trim(), '' }
          }
          if ($prev) { $notes += "**All changes**: $repoUrl/compare/$prev...$tag" }
          $notes | Set-Content "$env:RUNNER_TEMP/notes.md"

          $zip = "Hotd2Remake_ArcadePlugin_$tag.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Entries with '/' : with '\' some unzip tools make "BepInEx\plugins\..." file names instead of folders
          $root = (Resolve-Path package).Path
          $archive = [IO.Compression.ZipFile]::Open("$PWD/$zip", 'Create')
          foreach ($file in Get-ChildItem package -Recurse -File) {
            $entry = $file.FullName.Substring($root.Length + 1).Replace('\', '/')
            [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $file.FullName, $entry) | Out-Null
          }
          $archive.Dispose()
          gh release create $tag $zip --target $env:GITHUB_SHA --title $title --notes-file "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
