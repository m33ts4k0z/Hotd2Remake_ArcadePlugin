;Settings of the arcade plugin. They can also be changed with Hotd2Remake_ArcadeConfig.exe

[CREDITS]
;1 = no coins needed, START is enough
FREEPLAY=0
;Credits needed to start or join a game, and to continue after death (1-9)
CREDITS_TO_START=1
CREDITS_TO_CONTINUE=1

[INPUT_KEYS]
;Set Keycode (decimal value) for each key, keyboard keys only (no mouse or joystick buttons). See following link for the value list:
;https://gist.github.com/Extremelyd1/4bcd495e21453ed9e1dffa27f6ba5f69
P1_START=49
P2_START=50
P1_COIN=53
P2_COIN=54
;Quits the game (there is no in-game pause menu, like in the arcade). 0 = disabled
EXIT=27

[GAME]
;Game started with START from the title screen. It is always a Multiplayer campaign, so that P2 can join at any time
;MODE : Original or Arcade (the game's own modes)
MODE=Original
;DIFFICULTY : VeryEasy, Easy, Normal, Hard or VeryHard
DIFFICULTY=Normal
;SCORE_MODE : Classic or Modern
SCORE_MODE=Classic
;1 = the title screen only reacts to START, like an arcade cabinet. 0 = any other input still opens the game's main menu (settings...)
DISABLE_MAIN_MENU=1
;1 = separate save file in the game folder (NVRAM\saveData.sav), so that the arcade games don't change the home save.
;On first run, the home save is copied there to keep the settings and unlocked items
SAVE_IN_GAME_FOLDER=1
;1 = mouse cursor always hidden. Set 0 if you need it to use the game's menus (DISABLE_MAIN_MENU=0)
HIDE_CURSOR=1
;1 = no score and no weapon name during the game, like the original arcade. 0 = the game's own HUD
ARCADE_HUD=1

;The settings below replace the game's own settings (from the save file). Empty = the game's own setting
;Number of life torches (1-6), the game's default is 3
LIVES=
;LANGUAGE : English, Polish, German, French, Japanese, Spanish, Italian, Chinese or Portuguese
LANGUAGE=

[VIDEO]
;RESOLUTION : width x height, for example 1920x1080
RESOLUTION=
;FULLSCREEN_MODE : ExclusiveFullScreen, FullScreenWindow, MaximizedWindow or Windowed
FULLSCREEN_MODE=
;VSYNC : Off, EveryVBlank or EverySecondVBlank
VSYNC=
;ANTI_ALIASING : Off, SMAA or TAA
ANTI_ALIASING=
;SHADOW_QUALITY : Low, Medium or High
SHADOW_QUALITY=
;BLOOM, MOTION_BLUR, AMBIENT_OCCLUSION : 1 = on, 0 = off
BLOOM=
MOTION_BLUR=
AMBIENT_OCCLUSION=
;BRIGHTNESS : 0-100 (the game's default is 50)
BRIGHTNESS=
;HUD_SCALE : 50-150 %
HUD_SCALE=

[SOUND]
;Volumes : 0-100 (the game's default is 90)
MASTER_VOLUME=
MUSIC_VOLUME=
EFFECTS_VOLUME=
UI_VOLUME=
DIALOGS_VOLUME=
SHOT_VOLUME=
;1 = the original House of the Dead 2 music
CLASSIC_MUSIC=
;0 = no sound on the title screen (attract mode)
ATTRACT_SOUND=1
