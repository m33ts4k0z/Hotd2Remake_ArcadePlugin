[CREDITS]
;1 = no coins needed, START is enough
FREEPLAY=0
;Credits needed to start or join a game, and to continue after death (1-9)
CREDITS_TO_START=1
CREDITS_TO_CONTINUE=1

[INPUT_KEYS]
;Set Keycode (decimal value) for each key. See following link for the value list:
;https://gist.github.com/Extremelyd1/4bcd495e21453ed9e1dffa27f6ba5f69
P1_START=49
P2_START=50
P1_COIN=53
P2_COIN=54

[GAME]
;Game started with START from the title screen. It is always a Multiplayer campaign, so that P2 can join at any time
;MODE : Original, Arcade or Horde (the game's own modes)
MODE=Original
;DIFFICULTY : VeryEasy, Easy, Normal, Hard or VeryHard
DIFFICULTY=Normal
;SCORE_MODE : Classic or Modern
SCORE_MODE=Classic
;1 = the title screen only reacts to START, like an arcade cabinet. 0 = any other input still opens the game's main menu (settings...)
DISABLE_MAIN_MENU=1
;1 = separate save file in the game folder (NVRAM\saveData.sav), so that the arcade games don't change the home save.
;On first run, the home save is copied there to keep the settings and unlocked items
SAVE_IN_GAME_FOLDER=1
